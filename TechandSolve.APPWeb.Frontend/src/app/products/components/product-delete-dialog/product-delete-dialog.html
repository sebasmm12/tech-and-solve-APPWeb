<h1 mat-dialog-title>Eliminación del producto</h1>
<mat-dialog-content>
  <p>¿Estás seguro de que deseas eliminar el producto "{{ data.name }}"?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-button color="warn" (click)="delete()">Eliminar</button>
</mat-dialog-actions>
